<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sleek geospatial skills</title>

<!--
  Theme, restored BEFORE first paint.

  This script is deliberately blocking and deliberately inline. Anything async, and the
  browser paints the default ground first, so a dark-mode reader gets a white flash on every
  load. See the `ui-theme` skill.
-->
<script>
    try {
        var stored = localStorage.getItem('sgs-theme');   // 'light' | 'dark' | null (= system)
        if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
        }
    } catch (e) { /* private mode, blocked storage: system theme is a fine answer */ }
</script>

<link rel="stylesheet" href="vendor/maplibre-gl.css">

<!-- Three tiers, loaded in dependency order. See CONTRIBUTING.md
     for what each tier promises and how it is meant to travel between apps. -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components/swatch.css">
<link rel="stylesheet" href="css/components/source-pill.css">
<link rel="stylesheet" href="css/components/field-badge.css">
<link rel="stylesheet" href="css/components/field-table.css">
<link rel="stylesheet" href="css/components/buttons.css">
<link rel="stylesheet" href="css/components/tooltip.css">
<link rel="stylesheet" href="css/components/overlay-window.css">
<link rel="stylesheet" href="css/components/quick-settings.css">
<link rel="stylesheet" href="css/components/map-controls.css">
<link rel="stylesheet" href="css/components/edge-mark.css">
<link rel="stylesheet" href="css/components/debug-guides.css">
<link rel="stylesheet" href="css/furniture.css">
<link rel="icon" href="data:,">
</head>
<body>

<div id="map"></div>

<!-- The left panel. Its postures live in panel.js; its geometry reaches CSS through
     --sgs-panel-w / --sgs-panel-h. See the `ui-furniture` skill. -->
<!-- data-sgs-furniture: the framework contract. Any element carrying this attribute is
     scanned by app/js/utils/furniture.js for camera padding and popup obstacle avoidance —
     no id to register anywhere else. See CONTRIBUTING.md. -->
<div id="sgs-panel" class="sgs-panel" data-sgs-furniture>
    <div class="sgs-panel-head">
        <span class="sgs-panel-title">Layers</span>
        <div class="sgs-head-actions">
            <button class="sgs-icon-btn sgs-panel-dock" type="button"></button>
            <button class="sgs-icon-btn sgs-panel-fold" type="button" aria-expanded="true"
                    aria-controls="sgs-panel-body" title="Fold the layer panel"
                    aria-label="Fold the layer panel"></button>
            <button class="sgs-icon-btn sgs-panel-close" type="button"
                    title="Close the layer panel" aria-label="Close the layer panel"></button>
        </div>
    </div>
    <div class="sgs-panel-body" id="sgs-panel-body"></div>
    <div class="sgs-grip sgs-grip--w" data-grip="w" title="Drag to set the width, double-click to fit the rows"></div>
    <div class="sgs-grip sgs-grip--h" data-grip="h" title="Drag to set the height, double-click for automatic"></div>
</div>

<!-- The table (the table) is built by table.js on demand. What the markup carries is
     nothing: closed, the table's whole footprint is the mark tab table.js parks at the
     bottom edge. -->

<!--
  Vendored globals load with `defer`, in document order, ahead of the module entry point.
  A `type="module"` script is ALWAYS deferred, so it runs after every deferred classic
  script: `maplibregl` is guaranteed to exist by the time main.js executes, with no
  polling, no load event, and no bundler. See the `ui-boot` skill.
-->
<script defer src="vendor/maplibre-gl.js"></script>
<script type="module" src="js/main.js"></script>

</body>
</html>
