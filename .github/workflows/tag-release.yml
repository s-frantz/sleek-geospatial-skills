name: Tag release

# A merge to main always carries a version bump (enforced by version-check.yml on the PR), so
# a merge and a release are the same event: tag v<package.json version> automatically, and give
# the tag a GitHub release page whose notes are that version's CHANGELOG section. Each step skips
# quietly if its tag or release already exists, so a direct push that doesn't touch package.json (rare;
# admins can bypass the PR requirement) doesn't fail the run.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag v<version> from package.json if it doesn't exist yet
        run: |
          set -e
          VERSION=$(node -e "console.log(require('./package.json').version)")
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Tagged $TAG."

      - name: Release page for v<version>, notes from its CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION=$(node -e "console.log(require('./package.json').version)")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            exit 0
          fi
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {f = 1; next} /^## \[/ {f = 0} f' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then echo "See CHANGELOG.md." > notes.md; fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --latest
          echo "Released $TAG."
